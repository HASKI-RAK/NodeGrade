services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodegrade
      POSTGRES_PASSWORD: nodegrade
      POSTGRES_DB: nodegrade
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodegrade -d nodegrade']
      interval: 5s
      timeout: 5s
      retries: 10

  models:
    build:
      context: ./models
      dockerfile: Dockerfile
    ports:
      - '8002:8002'
    volumes:
      - model_cache:/models-cache
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '5000'
      DATABASE_URL: postgresql://nodegrade:nodegrade@db:5432/nodegrade?schema=public
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      MODEL_WORKER_URL: http://models:8000
      SIMILARITY_WORKER_URL: http://models:8002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KATALYST_API_KEY: ${KATALYST_API_KEY:-}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      # Without both of these the admin area stays disabled, and nobody can create the
      # workshop this stack exists to serve.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
      models:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  db_data:
  model_cache:

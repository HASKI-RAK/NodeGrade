name: PR

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.7.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      # The backend imports @haski/ta-lib from its build output, so the library has to be
      # compiled before anything can be typechecked or tested.
      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Test
        run: yarn test

  specs:
    name: Specification lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The linter reads specs/ with the standard library only, so it needs no install.
      - name: Lint specifications
        run: node tools/spec-lint/cli.mjs

      - name: Test the specification linter
        run: node --test tools/spec-lint/lint.test.mjs
